name: Publish Thinking Outside prerelease

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-release.yml
      - tests/test_benchmark.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Validate, package, publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate repository
        run: python tests/validate_repo.py
      - name: Run tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Validate skill format
        run: |
          python -m pip install skills-ref==0.1.1
          agentskills validate ./thinking-outside
      - name: Build portable release archive and checksum
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/package/thinking-outside
          cp thinking-outside/SKILL.md dist/package/thinking-outside/
          cp -R thinking-outside/references dist/package/thinking-outside/
          cp LICENSE dist/package/thinking-outside/
          (cd dist/package && zip -q -r ../thinking-outside-v1.0.0-rc.1.zip thinking-outside)
          (cd dist && sha256sum thinking-outside-v1.0.0-rc.1.zip > thinking-outside-v1.0.0-rc.1.zip.sha256)
          unzip -l dist/thinking-outside-v1.0.0-rc.1.zip
      - name: Create versioned GitHub prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v1.0.0-rc.1 >/dev/null 2>&1; then
            echo "Release already exists; will not overwrite it."
            exit 0
          fi
          gh release create v1.0.0-rc.1 \
            dist/thinking-outside-v1.0.0-rc.1.zip \
            dist/thinking-outside-v1.0.0-rc.1.zip.sha256 \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Thinking Outside v1.0.0-rc.1" \
            --notes-file docs/releases/v1.0.0-rc.1.md
