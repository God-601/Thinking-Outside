name: Validate Thinking Outside

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

jobs:
  structural:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate skill and evaluation cases
        run: python tests/validate_repo.py
